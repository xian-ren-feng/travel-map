<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的四川旅行地图</title>
<meta name="description" content="在四川省地图上点城市挑景点，收藏后自动按顺序生成旅行路线。可缩放、可筛选，单文件离线也能打开。">
<meta name="theme-color" content="#FFFCF5">
<meta property="og:type" content="website">
<meta property="og:site_name" content="我的四川旅行地图">
<meta property="og:title" content="我的四川旅行地图">
<meta property="og:description" content="在四川省地图上点城市挑景点，收藏后自动按顺序生成旅行路线。">
<meta property="og:image" content="assets/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D85A30'/%3E%3Cpath d='M9 43l13-18 8 11 7-9 18 16z' fill='%23fff'/%3E%3Ccircle cx='44' cy='20' r='5' fill='%23FFE8A3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFCF5; --card:#FFFFFF; --ink:#2C2C2A; --muted:#8A877E;
  --line:#EDE9DE; --brand:#D85A30; --brand-soft:#FAECE7;
  --r1:#D8EBFA; --r2:#FBDFD2; --r3:#E3F0D3; --r4:#FBE9C7; --r5:#E5E1F7;
  --shadow:0 6px 24px rgba(60,50,30,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);
  flex:0 0 auto;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{font-size:26px;line-height:1}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:#F5F2E9;padding:4px;border-radius:12px}
.tab{
  padding:8px 18px;border-radius:9px;font-size:14px;color:var(--muted);
  display:flex;align-items:center;gap:6px;transition:.18s;white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.tab em{
  font-style:normal;background:var(--brand);color:#fff;border-radius:20px;
  min-width:20px;height:20px;line-height:20px;font-size:11px;text-align:center;padding:0 5px;
}
.tab em.zero{background:#D9D5C9}

/* ---------- 主区 ---------- */
main{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.stage{
  height:100%;display:grid;grid-template-columns:minmax(0,1fr) 396px;
  gap:18px;padding:18px 22px 20px;min-height:0;
}

/* ---------- 地图 ---------- */
.mapbox{
  position:relative;background:var(--card);border-radius:20px;
  box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  padding:10px;min-height:0;overflow:hidden;
}
#bigmap{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
.mapbox.grabbing #bigmap{cursor:grabbing}

/* 缩放按钮 */
.zoomctl{
  position:absolute;right:14px;top:14px;z-index:7;
  display:flex;flex-direction:column;gap:6px;
}
.zoomctl button{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.95);
  border:1px solid var(--line);color:#4A4A45;font-size:15px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(60,50,30,.1);transition:.15s;
}
.zoomctl button:hover{background:#fff;border-color:#C9C2B0}
.zoomctl button:active{transform:scale(.94)}

/* 景点圆点：放在不缩放的图层里，所以尺寸恒定 */
.spin{cursor:pointer;transition:opacity .18s;opacity:0;pointer-events:none}
.spin.on{opacity:1;pointer-events:auto}
.spin .ring{fill:#fff;stroke:#D85A30;stroke-width:2.4}
.spin .core{fill:#D85A30}
.spin .lb{
  font-size:12.5px;font-weight:600;fill:#33322E;dominant-baseline:central;
  paint-order:stroke;stroke:rgba(255,255,255,.96);stroke-width:3.6;stroke-linejoin:round;
}
.spin:hover .ring{stroke-width:4}
.spin.done .ring{fill:#D85A30;stroke:#fff}
.spin.done .core{fill:#fff}
.spin.done .lb{fill:#B04A22}
.spin.minor .lb{display:none}
.spin.minor .ring{stroke:#B7B1A2;stroke-width:1.8;fill:#FBFAF4}
.spin.minor .core{fill:#C6C0B1}
.spin.minor:hover .ring{stroke:#9C968A}

/* 选中某个市时，其他市淡下去 */
#gShape.has-sel .region:not(.on){opacity:.48}
#gShape.has-sel .region:not(.on):hover{opacity:.72}
@media (max-width:980px){
  /* 小屏地图窄，按钮改成横排贴底，别压住地图 */
  .zoomctl{
    right:12px;bottom:12px;top:auto;transform:none;
    flex-direction:row;gap:6px;
  }
  .zoomctl button{width:34px;height:34px}
  .legend{display:none}
  .note{left:12px;right:auto;bottom:16px;font-size:10.5px}
}
.region{
  stroke:#fff;stroke-width:1.6;transition:filter .16s,opacity .16s;
  cursor:pointer;vector-effect:non-scaling-stroke;
}
.region[data-region="成都平原"]{fill:var(--r1)}
.region[data-region="川南"]{fill:var(--r2)}
.region[data-region="川东北"]{fill:var(--r3)}
.region[data-region="攀西"]{fill:var(--r4)}
.region[data-region="川西北"]{fill:var(--r5)}
.region:hover{filter:brightness(.92)}
.region.on{stroke:#2C2C2A;stroke-width:3}
.region.hit{stroke:#2C2C2A;stroke-width:2.4}
.region.picked{stroke:#D85A30;stroke-width:2.6}
.region.on.picked{stroke:#D85A30;stroke-width:3.6}
.region.dim{fill:#F0EDE4;filter:none}
.clabel{
  font-size:17px;font-weight:600;fill:#53504A;text-anchor:middle;
  dominant-baseline:central;pointer-events:none;user-select:none;
  paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:4;stroke-linejoin:round;
}
.clabel.sm{font-size:14.5px}
.clabel.on{fill:#1A1A18;font-weight:700}
.clabel.dimmed{fill:#A8A498;stroke:none;font-weight:500;font-size:15.5px}
.clabel.dimmed.on{fill:#1A1A18;font-weight:700}

/* 图例 */
.legend{
  position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 12px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  padding:9px 12px;border-radius:11px;border:1px solid var(--line);max-width:78%;
}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.legend span{font-size:12px;color:var(--muted);white-space:nowrap}
.hint{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:#2C2C2A;color:#fff;font-size:12.5px;padding:7px 15px;border-radius:20px;
  opacity:.92;transition:.4s;pointer-events:none;white-space:nowrap;
}
.hint.hide{opacity:0;transform:translateX(-50%) translateY(-8px)}
.note{
  position:absolute;right:14px;bottom:14px;font-size:11px;color:#B3AFA4;
}

/* 城市速查 */
.intro{text-align:center;padding:26px 12px 18px}
.intro .big{font-size:50px;line-height:1;filter:saturate(.85)}
.intro h3{margin:12px 0 6px;font-size:16px;font-weight:600}
.intro p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.qgroup{margin-bottom:16px}
.qgroup h5{
  margin:0 0 8px;font-size:11.5px;font-weight:600;color:#A8A498;letter-spacing:1px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 13px;border-radius:10px;background:#F7F4EA;font-size:13px;
  color:#5C594F;transition:.15s;border:1px solid transparent;
}
.chip:hover{background:#EFEADB;color:var(--ink);border-color:#E2DCCB}
.chip.act{background:var(--brand);color:#fff}

/* ---------- 右侧面板 ---------- */
.panel{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  border:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;overflow:hidden;
}
.panel-scroll{overflow-y:auto;padding:18px;flex:1 1 auto;min-height:0}
.panel-scroll::-webkit-scrollbar{width:7px}
.panel-scroll::-webkit-scrollbar-thumb{background:#E4E0D3;border-radius:4px}

.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--muted);text-align:center;padding:24px;
}
.empty .big{font-size:52px;line-height:1;filter:saturate(.85)}
.empty p{margin:0;font-size:14px;line-height:1.75}
.empty small{color:#B3AFA4;font-size:12px}

.cityhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.cityhead h2{margin:0;font-size:22px;font-weight:600;letter-spacing:.4px}
.tag{
  font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--brand-soft);
  color:var(--brand);font-weight:500;
}
.citydesc{margin:8px 0 16px;font-size:12.5px;color:var(--muted);line-height:1.7}
.tipline{font-size:11.5px;color:#B0AB9D}

.spot{
  border:1px solid var(--line);border-radius:16px;margin-bottom:11px;
  background:#FFFEFA;overflow:hidden;transition:.18s;cursor:pointer;
}
.spot:hover{border-color:#DCD5C4;transform:translateY(-1px);box-shadow:0 6px 18px rgba(60,50,30,.08)}
.thumb{
  height:160px;position:relative;display:flex;align-items:center;justify-content:center;
  background:#F4F1E6;overflow:hidden;transition:background .25s;
}
.thumb[data-t="亲子"]{background:#FDEFE4}
.thumb[data-t="人文"]{background:#F0EDFB}
.thumb[data-t="自然"]{background:#EAF3E5}
.thumb[data-t="刺激"]{background:#FBEAEA}
.thumb[data-t="美食"]{background:#FDF1DC}
.thumb[data-t="夜景"]{background:#E9ECF8}
.thumb[data-t="科普"]{background:#E4F1F4}
.thumb[data-t="安静"]{background:#EFF3E7}
.thumb .em{font-size:44px;line-height:1;filter:saturate(.9)}
.thumb img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 45%;
  opacity:0;transition:opacity .35s,transform .5s;
}
.thumb img.ok{opacity:1}
.spot:hover .thumb img.ok{transform:scale(1.04)}
.spot .body{padding:12px 13px 13px}
.spot h3{margin:0 0 5px;font-size:15px;font-weight:600;line-height:1.35}
.spot p{margin:0 0 9px;font-size:12.5px;color:#6E6A61;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.spot .fee{font-size:11.5px;color:var(--muted)}
.spot .add{
  flex:0 0 auto;background:var(--brand);color:#fff;
  padding:7px 15px;border-radius:9px;font-size:12.5px;font-weight:500;transition:.16s;
}
.spot .add:hover{background:#C24E28}
.spot .add.done{background:#EAF3DE;color:#4B7A17;cursor:default}
.spot.added{border-color:#DCEBC6}

/* 标签 */
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tg{
  font-size:11px;padding:2.5px 8px;border-radius:7px;
  background:#F4F1E7;color:#7C7869;white-space:nowrap;
}
.tg[data-t="亲子"]{background:#FFEDE1;color:#B65A28}
.tg[data-t="人文"]{background:#EFECFB;color:#594FB0}
.tg[data-t="自然"]{background:#E7F3E2;color:#3C7A2C}
.tg[data-t="刺激"]{background:#FDE7E7;color:#B23A3E}
.tg[data-t="美食"]{background:#FDEED6;color:#A0641A}
.tg[data-t="夜景"]{background:#E6E9F7;color:#3F4C8E}
.tg[data-t="科普"]{background:#DFF0F3;color:#1B7A88}
.tg[data-t="安静"]{background:#EDF2E3;color:#5A6B3A}

/* 筛选条 */
.filterbar{
  display:flex;gap:6px;padding:11px 14px;flex-wrap:wrap;flex:0 0 auto;
  border-bottom:1px solid var(--line);background:#FDFCF7;
}
.fchip{
  flex:0 0 auto;font-size:12.5px;padding:6px 12px;border-radius:9px;
  background:#F4F1E7;color:#6E6A61;transition:.15s;border:1px solid transparent;
  display:flex;align-items:center;gap:4px;
}
.fchip:hover{background:#EDE8D8}
.fchip.on{background:var(--brand);color:#fff;font-weight:500}
.fchip.on:hover{background:#C24E28}

.resulthead{padding:2px 0 12px;font-size:13px;color:var(--muted)}
.resulthead b{color:var(--ink);font-weight:600;font-size:14.5px}

/* ---------- 行程 ---------- */
.tripstat{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:16px 14px 14px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.tripstat div{text-align:center}
.tripstat b{display:block;font-size:19px;font-weight:600;line-height:1.2}
.tripstat span{font-size:11.5px;color:var(--muted)}

.step{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;
  border:1px solid var(--line);margin-bottom:9px;background:#FFFEFA;position:relative;
}
.num{
  flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
}
.leg{display:flex;align-items:center;gap:9px;padding:0 0 0 26px;height:26px;margin:-3px 0 6px}
.leg i{
  width:2px;height:100%;border-radius:1px;
  background:repeating-linear-gradient(to bottom,#D8C3B2 0 3px,transparent 3px 7px);
}
.leg span{
  font-size:10.5px;color:#A98F7C;background:#FBF5EE;border:1px solid #F0E4D8;
  padding:1px 8px;border-radius:9px;white-space:nowrap;
}
.step .body{flex:1 1 auto;min-width:0}
.step h3{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.ops{display:flex;gap:2px;flex:0 0 auto}
.ops button{
  width:26px;height:26px;border-radius:7px;color:#A8A498;font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.ops button:hover{background:#F3F0E6;color:var(--ink)}
.ops button:disabled{opacity:.25;cursor:default}
.ops button.del:hover{background:#FCEBEB;color:#C0392B}

.tripfoot{
  padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex:0 0 auto;
}
.btn-ghost{
  flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);
  font-size:13px;color:var(--muted);transition:.16s;
}
.btn-ghost:hover{background:#F7F4EA;color:var(--ink)}

/* 路线图元素 */
.routepath{fill:none;stroke:#D85A30;stroke-width:3;stroke-linecap:round;
  stroke-dasharray:9 7;animation:dash 24s linear infinite}
@keyframes dash{to{stroke-dashoffset:-320}}
.rpin circle{fill:#fff;stroke:#D85A30;stroke-width:2.6}
.rpin text{font-size:15px;font-weight:700;fill:#D85A30;text-anchor:middle;dominant-baseline:central}
.rpin.first circle{fill:#D85A30;stroke:#fff;stroke-width:3.2}
.rpin.first text{fill:#fff}

/* ---------- 景点详情 ---------- */
.modal{
  position:fixed;inset:0;background:rgba(40,36,28,.44);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:80;padding:24px;
}
.modal.on{display:flex}
.sheet{
  background:var(--card);border-radius:22px;width:min(460px,100%);
  max-height:88vh;overflow-y:auto;position:relative;
  box-shadow:0 22px 60px rgba(0,0,0,.25);animation:pop .22s ease-out;
}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.hero{
  height:196px;background:#F4F1E6;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.hero .em{font-size:66px;line-height:1}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%}
.sheet .close{
  position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#5C594F;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.14);
}
.mbody{padding:18px 20px 20px}
.mbody h2{margin:0 0 4px;font-size:20px;font-weight:600;line-height:1.3}
.mcity{font-size:12.5px;color:var(--muted);margin-bottom:11px}
.mhi{margin:13px 0 0;font-size:13.5px;line-height:1.85;color:#55524A}
.facts{display:flex;gap:8px;margin:15px 0 13px}
.fact{flex:1;background:#F8F5EC;border-radius:11px;padding:9px 11px;text-align:center}
.fact b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.fact span{font-size:11px;color:var(--muted)}
.tipbox{
  background:#FDF6E8;border-left:3px solid #E9B949;border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:12.5px;line-height:1.75;color:#7A6420;margin-bottom:16px;
}
.madd{width:100%;background:var(--brand);color:#fff;padding:13px;border-radius:13px;
  font-size:14.5px;font-weight:500;transition:.16s}
.madd:hover{background:#C24E28}
.madd.done{background:#EAF3DE;color:#4B7A17}
.credit{margin-top:11px;text-align:center;font-size:10.5px;color:#B8B4A8;line-height:1.6}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:#2C2C2A;color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.28s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.18);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 响应式 ---------- */
@media (max-width:980px){
  body{overflow:auto}
  .stage{grid-template-columns:1fr;height:auto;gap:14px;padding:12px}
  .mapbox{height:min(62vh,460px)}
  .panel{max-height:none}
  .panel-scroll{max-height:52vh}
  .brand p{display:none}
  .tab{padding:8px 12px;font-size:13px}
  .legend{display:none}
  .note{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🗺️</span>
    <div>
      <h1>我的四川旅行地图</h1>
      <p>点一个城市 → 挑几个景点 → 看看路线会长什么样</p>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab on" data-view="map">地图</button>
    <button class="tab" data-view="trip">我的行程 <em id="tripCount" class="zero">0</em></button>
  </nav>
</header>

<main>
  <!-- 地图页 -->
  <section class="view on" id="view-map">
    <div class="stage">
      <div class="mapbox" id="mapBox">
        <svg id="bigmap" role="img" aria-label="四川省 21 个市州地图"></svg>
        <div class="zoomctl">
          <button id="zIn" title="放大">＋</button>
          <button id="zOut" title="缩小">－</button>
          <button id="zFit" title="回到全川">⛶</button>
        </div>
        <div class="hint" id="hint">滚轮缩放 · 按住拖拽 · 点城市挑景点</div>
        <div class="legend">
          <span><i style="background:var(--r1)"></i>成都平原</span>
          <span><i style="background:var(--r2)"></i>川南</span>
          <span><i style="background:var(--r3)"></i>川东北</span>
          <span><i style="background:var(--r4)"></i>攀西</span>
          <span><i style="background:var(--r5)"></i>川西北</span>
        </div>
        <div class="note">教学示意图 · 不作地理依据</div>
      </div>
      <aside class="panel">
        <div class="filterbar" id="filterbar"></div>
        <div class="panel-scroll" id="panelPick">
          <div id="cityArea">
            <div class="intro">
              <div class="big">🧳</div>
              <h3>还没有选城市</h3>
              <p>地图上有 21 个市州<br>点哪个，就看哪里的景点</p>
            </div>
          </div>
          <div id="quick"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- 行程页 -->
  <section class="view" id="view-trip">
    <div class="stage">
      <div class="mapbox">
        <svg id="mapRoute" viewBox="0 0 1000 860" preserveAspectRatio="xMidYMid meet" role="img" aria-label="我的旅行路线图"></svg>
        <div class="hint hide" id="tripHint">路线是按你添加的顺序连的，不是最近的走法</div>
        <div class="note">教学示意图 · 不作地理依据</div>
      </div>
      <aside class="panel">
        <div class="tripstat">
          <div><b id="stSpots">0</b><span>个景点</span></div>
          <div><b id="stCities">0</b><span>座城市</span></div>
          <div><b id="stDays">0</b><span>预计天数</span></div>
          <div><b id="stKm">0</b><span>总里程</span></div>
        </div>
        <div class="panel-scroll" id="tripList"></div>
        <div class="tripfoot">
          <button class="btn-ghost" id="btnClear">清空重来</button>
          <button class="btn-ghost" id="btnBack">继续选景点</button>

  </section>
</main>

<div id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" id="mClose">✕</button>
    <div class="hero" id="mHero"></div>
    <div class="mbody">
      <h2 id="mName"></h2>
      <div class="mcity" id="mCity"></div>
      <div class="tagrow" id="mTags"></div>
      <p class="mhi" id="mHi"></p>
      <div class="facts" id="mFacts"></div>
      <div class="tipbox" id="mTip"></div>
      <button class="madd" id="mAdd">加入行程</button>
      <div class="credit">照片来自公开网络，仅作教学演示；门票与开放时间以景区公告为准</div>
    </div>
  </div>
</div>

<script>
/*__MAP_DATA__*/

const REGION_ORDER = ['成都平原','川南','川东北','攀西','川西北'];
const STAY_DAYS = {'半天':0.5,'一天':1,'两天':2,'三天':3,'三天以上':4};
const KEY = 'sc-trip-v1';

/*__SPOTS__*/

/* ---------- 状态 ---------- */
let trip = [];
try{ trip = JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ trip = []; }
let currentCity = null;
let filterTags = [];
let detailSpot = null;

const $ = s => document.querySelector(s);
const cityMap = {};
SC_MAP.forEach(c => cityMap[c.short] = c);

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(trip)); }catch(e){}
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('on'), 1700);
}

/* ---------- 画地图 ---------- */
function buildMap(svg, mode){
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const g = document.createElementNS(NS,'g');
  SC_MAP.forEach(c=>{
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d', c.d);
    p.setAttribute('class','region');
    p.dataset.region = c.region;
    p.dataset.city = c.short;
    if(mode === 'pick'){
      p.addEventListener('click', ()=>selectCity(c.short));
      const tp = document.createElementNS(NS,'title');
      tp.textContent = c.name + ' · ' + c.region;
      p.appendChild(tp);
    }else{
      p.classList.add('dim');
      p.style.cursor = 'default';
    }
    g.appendChild(p);
  });
  svg.appendChild(g);

  const gl = document.createElementNS(NS,'g');
  const SMALL = {'成都':1,'攀枝花':1,'内江':1};
  SC_MAP.forEach(c=>{
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', c.cx); t.setAttribute('y', c.cy);
    t.setAttribute('class','clabel' + (SMALL[c.short] ? ' sm' : '') + (mode === 'route' ? ' dimmed' : ''));
    t.dataset.city = c.short;
    t.textContent = c.short;
    gl.appendChild(t);
  });
  svg.appendChild(gl);
  return svg;
}

/* ---------- 可缩放地图（相机模型） ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
const CONTENT = { w: 1000, h: 860 };

function geo2svg(lon, lat){
  return {
    x: (lon - PROJ.lon0) * PROJ.cos * PROJ.scale + PROJ.offX,
    y: (PROJ.lat1 - lat) * PROJ.scale + PROJ.offY
  };
}

const cam = { k: 1, tx: 0, ty: 0 };
let kMin = 1;                 // 全川正好铺满时的缩放（最小）
const KMAX_RATIO = 14;        // 相对全川最多放大多少倍
let mapBoxEl = null;

function boxSize(){
  if(!mapBoxEl) mapBoxEl = $('#mapBox');
  const r = mapBoxEl.getBoundingClientRect();
  return { w: Math.max(r.width, 1), h: Math.max(r.height, 1) };
}

/* 每个景点到“最近另一个景点”的距离（地图单位），决定放大到几倍才显示它 */
function computeNearest(){
  const list = SPOTS.filter(s => typeof s.lon === 'number');
  list.forEach(a=>{
    let d = 1e9;
    list.forEach(b=>{
      if(a === b) return;
      const dx = (a.lon - b.lon) * PROJ.cos;
      const dy = a.lat - b.lat;
      const dd = Math.hypot(dx, dy) * PROJ.scale;
      if(dd < d) d = dd;
    });
    a._near = Math.max(d, 1);
  });
}

/* 屏幕上两点至少隔 34px 才看得清 → 换算成需要的缩放倍数 */
function refreshThresholds(){
  SPOTS.forEach(s=>{
    if(typeof s.lon !== 'number'){ s._kShow = 1e9; s._kLabel = 1e9; return; }
    /* 圆点：两点屏幕距离至少 34px；名字：至少 62px，挤不下就先只给点 */
    s._kShow  = Math.max(kMin * 1.9, 34 / s._near);
    s._kLabel = Math.max(kMin * 3.4, 62 / s._near);
  });
}

function recomputeKMin(){
  const { w, h } = boxSize();
  kMin = Math.min(w / CONTENT.w, h / CONTENT.h) * 0.97;
}

/* ---------- 建图 ---------- */
function buildBigMap(){
  const svg = $('#bigmap');
  svg.innerHTML = '';

  const gs = document.createElementNS(SVGNS, 'g');
  gs.id = 'gShape';
  SC_MAP.forEach(c=>{
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', c.d);
    p.setAttribute('class', 'region');
    p.dataset.region = c.region;
    p.dataset.city = c.short;
    const tp = document.createElementNS(SVGNS, 'title');
    tp.textContent = c.name + ' · ' + c.region;
    p.appendChild(tp);
    p.addEventListener('click', ()=>{ if(!suppressClick) selectCity(c.short); });
    gs.appendChild(p);
    c._path = p;
  });
  svg.appendChild(gs);

  const gl = document.createElementNS(SVGNS, 'g');
  gl.id = 'gLabel';
  SC_MAP.forEach(c=>{
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('class', 'clabel');
    t.dataset.city = c.short;
    t.textContent = c.short;
    gl.appendChild(t);
    c._label = t;
  });
  svg.appendChild(gl);

  const gp = document.createElementNS(SVGNS, 'g');
  gp.id = 'gSpot';
  SPOTS.forEach(sp=>{
    if(typeof sp.lon !== 'number') return;
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'spin');
    const ring = document.createElementNS(SVGNS, 'circle');
    ring.setAttribute('class', 'ring');
    ring.setAttribute('r', 7.5);
    const core = document.createElementNS(SVGNS, 'circle');
    core.setAttribute('class', 'core');
    core.setAttribute('r', 2.6);
    const lb = document.createElementNS(SVGNS, 'text');
    lb.setAttribute('class', 'lb');
    const ti = document.createElementNS(SVGNS, 'title');
    ti.textContent = sp.u + ' · ' + sp.n;
    g.appendChild(ti);
    g.appendChild(ring); g.appendChild(core); g.appendChild(lb);
    g.addEventListener('click', e=>{ e.stopPropagation(); if(!suppressClick) openDetail(sp); });
    gp.appendChild(g);
    sp._pin = g; sp._lb = lb; sp._ring = ring;
  });
  svg.appendChild(gp);
}

/* ---------- 渲染 ---------- */
function render(){
  const { w: W, h: H } = boxSize();
  const zr = cam.k / kMin;

  $('#gShape').setAttribute('transform', `translate(${cam.tx.toFixed(2)} ${cam.ty.toFixed(2)}) scale(${cam.k.toFixed(4)})`);

  /* 城市名 */
  SC_MAP.forEach(c=>{
    const t = c._label;
    if(!t) return;
    const x = c.cx * cam.k + cam.tx, y = c.cy * cam.k + cam.ty;
    if(x < -70 || x > W + 70 || y < -50 || y > H + 50){
      if(t.style.display !== 'none') t.style.display = 'none';
      return;
    }
    /* 放大看某个市时，这个市的名字让给景点标签，免得打架 */
    if(currentCity === c.short && zr > 2.5){
      if(t.style.display !== 'none') t.style.display = 'none';
      return;
    }
    if(t.style.display === 'none') t.style.display = '';
    t.setAttribute('x', x.toFixed(1));
    t.setAttribute('y', y.toFixed(1));
    const fs = Math.min(18, 13.5 * Math.pow(zr, 0.24));
    t.style.fontSize = fs.toFixed(1) + 'px';
    t.style.opacity = (currentCity && c.short !== currentCity) ? '0.3' : (zr > 3.2 ? '0.55' : '1');
  });

  /* 先算屏幕位置、决定谁露脸 */
  const shown = [];
  SPOTS.forEach(sp=>{
    if(!sp._pin) return;
    const pt = geo2svg(sp.lon, sp.lat);
    const x = pt.x * cam.k + cam.tx, y = pt.y * cam.k + cam.ty;
    sp._sx = x; sp._sy = y;
    const inView = x > -50 && x < W + 50 && y > -50 && y < H + 50;
    sp._ok = cam.k >= sp._kShow && inView;
    /* 已经选中某个市时，别的市的点降级成小灰点，不再抢戏 */
    sp._minor = !!currentCity && sp.u !== currentCity;

    const pin = sp._pin;
    if(!sp._ok){
      pin.classList.remove('on');
      pin.classList.remove('minor');
      return;
    }
    pin.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    pin.classList.add('on');
    if(sp._minor){
      pin.classList.add('minor');
      if(sp._ring) sp._ring.setAttribute('r', 5.4);
    }else{
      pin.classList.remove('minor');
      if(sp._ring) sp._ring.setAttribute('r', 7.5);
      shown.push(sp);
    }
  });

  /* 选中市时，其余市州淡下去 */
  $('#gShape').classList.toggle('has-sel', !!currentCity);

  /* 标签避让：从上往下逐个占位 */
  shown.sort((a, b) => a._sy - b._sy);
  const placed = [];
  let hid = 0;
  shown.forEach(sp=>{
    const lb = sp._lb;
    /* 缩得太小时先只给圆点，名字留着放大再看 */
    if(cam.k < sp._kLabel){
      if(lb.style.display !== 'none') lb.style.display = 'none';
      return;
    }
    if(lb.style.display === 'none') lb.style.display = '';

    const toLeft = sp._sx > W * 0.62;
    const fs = 12.5;
    const tw = sp.n.length * fs * 1.02;
    const th = fs * 1.55;
    const lx = toLeft ? -12 : 12;
    const bx = toLeft ? (sp._sx + lx - tw) : (sp._sx + lx);
    let ty = sp._sy;
    let ok = true;
    for(let step = 0; step < 6; step++){
      const hit = placed.some(b => bx < b.x + b.w && bx + tw > b.x && ty - th / 2 < b.y + b.h && ty + th / 2 > b.y);
      if(!hit) break;
      ty += th * 1.08;
      if(step === 5) ok = false;
    }
    placed.push({ x: bx, y: ty - th / 2, w: tw, h: th });

    lb.textContent = sp.n;
    lb.setAttribute('x', lx);
    lb.setAttribute('y', (ty - sp._sy).toFixed(1));
    lb.setAttribute('text-anchor', toLeft ? 'end' : 'start');
    lb.style.opacity = ok ? '1' : '.4';
  });

  /* 没露脸的要收起来 */
  SPOTS.forEach(sp=>{
    if(sp._pin && !sp._ok) sp._pin.classList.remove('on');
  });
}

/* 行程变化后，让圆点颜色跟着变 */
function syncPinStates(){
  SPOTS.forEach(sp=>{
    if(!sp._pin) return;
    sp._pin.classList.toggle('done', trip.some(x => x.u === sp.u && x.n === sp.n));
  });
}

/* ---------- 相机操作 ---------- */
function clampCam(){
  const { w: W, h: H } = boxSize();
  cam.k = Math.min(kMin * KMAX_RATIO, Math.max(kMin, cam.k));
  const cw = CONTENT.w * cam.k, ch = CONTENT.h * cam.k;
  if(cw <= W) cam.tx = (W - cw) / 2;
  else cam.tx = Math.min(0, Math.max(W - cw, cam.tx));
  if(ch <= H) cam.ty = (H - ch) / 2;
  else cam.ty = Math.min(0, Math.max(H - ch, cam.ty));
}

let flyRAF = 0;
function flyTo(k2, tx2, ty2, dur){
  const k1 = cam.k, x1 = cam.tx, y1 = cam.ty;
  const t0 = performance.now();
  cancelAnimationFrame(flyRAF);
  dur = dur || 440;
  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    cam.k = k1 + (k2 - k1) * e;
    cam.tx = x1 + (tx2 - x1) * e;
    cam.ty = y1 + (ty2 - y1) * e;
    render();
    if(p < 1) flyRAF = requestAnimationFrame(step);
  }
  flyRAF = requestAnimationFrame(step);
}

function fitAll(animate){
  recomputeKMin();
  refreshThresholds();
  const { w: W, h: H } = boxSize();
  const k = kMin;
  const tx = (W - CONTENT.w * k) / 2, ty = (H - CONTENT.h * k) / 2;
  if(animate) flyTo(k, tx, ty, 480);
  else { cam.k = k; cam.tx = tx; cam.ty = ty; render(); }
}

function flyToCity(short){
  const c = cityMap[short];
  if(!c) return;
  const { w: W, h: H } = boxSize();
  const [x0, y0, x1, y1] = c.bb;
  const bw = Math.max(x1 - x0, 1), bh = Math.max(y1 - y0, 1);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;

  let k = Math.min(W * 0.88 / bw, H * 0.88 / bh);
  /* 至少放大到能看清这个市最挤的那个景点 */
  const mine = SPOTS.filter(s => s.u === short && s._kShow < 1e8);
  if(mine.length) k = Math.max(k, Math.max(...mine.map(s => s._kShow)));
  k = Math.min(kMin * KMAX_RATIO, Math.max(kMin, k));

  cam.k = k;
  cam.tx = W / 2 - cx * k;
  cam.ty = H / 2 - cy * k;
  clampCam();                       /* 靠边的市州别把画面拖出空白 */
  flyTo(cam.k, cam.tx, cam.ty, 480);
}

function zoomBy(f){
  const { w: W, h: H } = boxSize();
  const mx = W / 2, my = H / 2;
  let k2 = Math.min(kMin * KMAX_RATIO, Math.max(kMin, cam.k * f));
  if(k2 === cam.k) return;
  cam.tx = mx - (mx - cam.tx) * (k2 / cam.k);
  cam.ty = my - (my - cam.ty) * (k2 / cam.k);
  cam.k = k2;
  clampCam(); render();
}

/* ---------- 交互 ---------- */
let dragging = false, suppressClick = false, dStart = null;

function bindMapEvents(){
  const box = $('#mapBox');
  mapBoxEl = box;

  box.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = box.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const factor = Math.pow(1.00092, -e.deltaY);
    const k2 = Math.min(kMin * KMAX_RATIO, Math.max(kMin, cam.k * factor));
    if(k2 === cam.k) return;
    cam.tx = mx - (mx - cam.tx) * (k2 / cam.k);
    cam.ty = my - (my - cam.ty) * (k2 / cam.k);
    cam.k = k2;
    clampCam(); render();
    hideHint();
  }, { passive:false });

  box.addEventListener('pointerdown', e=>{
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target.closest('.zoomctl')) return;
    dragging = true;
    dStart = { x: e.clientX, y: e.clientY, tx: cam.tx, ty: cam.ty };
    suppressClick = false;
    box.classList.add('grabbing');
  });

  window.addEventListener('pointermove', e=>{
    if(!dragging || !dStart) return;
    const dx = e.clientX - dStart.x, dy = e.clientY - dStart.y;
    if(!suppressClick && Math.hypot(dx, dy) > 5) suppressClick = true;
    cam.tx = dStart.tx + dx;
    cam.ty = dStart.ty + dy;
    clampCam(); render();
  });

  window.addEventListener('pointerup', ()=>{
    if(!dragging) return;
    dragging = false;
    box.classList.remove('grabbing');
    if(suppressClick) setTimeout(()=>{ suppressClick = false; }, 80);
  });

  $('#zIn').addEventListener('click', ()=>{ zoomBy(1.65); hideHint(); });
  $('#zOut').addEventListener('click', ()=> zoomBy(1 / 1.65));
  $('#zFit').addEventListener('click', ()=> fitAll(true));

  let rzT = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(rzT);
    rzT = setTimeout(()=>{
      const atFit = cam.k <= kMin * 1.04;
      recomputeKMin(); refreshThresholds();
      if(atFit) fitAll(false);
      else { clampCam(); render(); }
    }, 160);
  });
}

function hideHint(){
  const h = $('#hint');
  if(h) h.classList.add('hide');
}

/* ---------- 地图页 ---------- */
function selectCity(short){
  currentCity = short;
  if(filterTags.length){ filterTags = []; renderFilterbar(); }
  document.querySelectorAll('#bigmap .region').forEach(p=>{
    p.classList.toggle('on', p.dataset.city === short);
  });
  document.querySelectorAll('#bigmap .clabel').forEach(t=>{
    t.classList.toggle('on', t.dataset.city === short);
  });
  document.querySelectorAll('.chip').forEach(b=>{
    b.classList.toggle('act', b.dataset.city === short);
  });
  renderPanel();
  $('#panelPick').scrollTop = 0;
  flyToCity(short);
  hideHint();
  if(window.innerWidth < 980){
    const p = document.querySelector('#view-map .panel');
    if(p) p.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function renderQuick(){
  const box = $('#quick');
  box.innerHTML = '';
  REGION_ORDER.forEach(rg=>{
    const g = document.createElement('div');
    g.className = 'qgroup';
    g.innerHTML = `<h5>${rg}</h5><div class="chips"></div>`;
    const wrap = g.querySelector('.chips');
    SC_MAP.filter(c=>c.region===rg).forEach(c=>{
      const b = document.createElement('button');
      b.className = 'chip'; b.dataset.city = c.short; b.textContent = c.short;
      b.addEventListener('click', ()=>selectCity(c.short));
      wrap.appendChild(b);
    });
    box.appendChild(g);
  });
}

/* ---------- 渲染 ---------- */
function spotCard(s){
  const has = trip.some(x => x.u === s.u && x.n === s.n);
  const el = document.createElement('article');
  el.className = 'spot' + (has ? ' added' : '');
  const img = s.img
    ? `<img src="${s.img}" alt="${s.n}" loading="lazy" onload="this.classList.add('ok')" onerror="this.remove()">`
    : '';
  el.innerHTML = `
    <div class="thumb" data-t="${s.tags[0]}"><span class="em">${s.e}</span>${img}</div>
    <div class="body">
      <h3>${s.n}</h3>
      <p>${s.d}</p>
      <div class="tagrow">${s.tags.map(t => `<span class="tg" data-t="${t}">${t}</span>`).join('')}</div>
      <div class="foot">
        <span class="fee">${s.u} · ${s.t} · ${s.fee}</span>
        <button class="add${has ? ' done' : ''}">${has ? '已加入' : '加入'}</button>
      </div>
    </div>`;
  el.addEventListener('click', () => openDetail(s));
  el.querySelector('.add').addEventListener('click', e => {
    e.stopPropagation();
    addSpot(s);
  });
  return el;
}

function renderIntro(){
  $('#cityArea').innerHTML = `
    <div class="intro">
      <div class="big">🧳</div>
      <h3>还没有选城市</h3>
      <p>地图上有 21 个市州<br>点哪个，就看哪里的景点</p>
    </div>`;
  highlightCities(null);
}

function renderCity(short){
  const c = cityMap[short];
  const list = SPOTS.filter(s => s.u === short);
  const panel = $('#cityArea');
  highlightCities(null);
  if(!list.length){
    panel.innerHTML = `<div class="empty"><div class="big">🗺️</div><p>${short}</p><small>这个地方的景点还在整理中</small></div>`;
    return;
  }
  const picked = trip.filter(x => x.u === short).length;
  panel.innerHTML = `
    <div class="cityhead"><h2>${short}</h2><span class="tag">${c.region}</span></div>
    <p class="citydesc">${c.name} · 共 ${list.length} 个景点${picked ? `，你已经选了 ${picked} 个` : '，挑你想去的加进行程'}<br><span class="tipline">地图上的圆点是它们的大概位置，点一下也能看详情</span></p>
    <div id="spotWrap"></div>`;
  const wrap = $('#spotWrap');
  list.forEach(s => wrap.appendChild(spotCard(s)));
}

function renderFilter(){
  if(currentCity){
    currentCity = null;
    document.querySelectorAll('#bigmap .region').forEach(p=>p.classList.remove('on'));
    document.querySelectorAll('#bigmap .clabel').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('act'));
  }
  fitAll(true);
  const list = SPOTS.filter(s => filterTags.every(t => s.tags.includes(t)));
  const panel = $('#cityArea');
  panel.innerHTML = `
    <div class="resulthead"><b>${filterTags.join(' + ')}</b> · 全川 ${list.length} 个景点</div>
    <div id="spotWrap"></div>`;
  const wrap = $('#spotWrap');
  if(!list.length){
    wrap.innerHTML = `<div class="empty"><div class="big">🔍</div><p>没有同时满足的景点</p><small>少选一个标签再试试</small></div>`;
  }else{
    list.forEach(s => wrap.appendChild(spotCard(s)));
  }
  highlightCities(list.map(s => s.u));
}

function highlightCities(cities){
  document.querySelectorAll('#bigmap .region').forEach(p=>{
    p.classList.toggle('hit', !!cities && cities.includes(p.dataset.city));
  });
}

function renderPanel(){
  if(filterTags.length) renderFilter();
  else if(currentCity) renderCity(currentCity);
  else renderIntro();
}

function renderFilterbar(){
  const bar = $('#filterbar');
  bar.innerHTML = TAGS.map(t =>
    `<button class="fchip${filterTags.includes(t.k) ? ' on' : ''}" data-tag="${t.k}">${t.i} ${t.k}</button>`
  ).join('');
  bar.querySelectorAll('.fchip').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.dataset.tag;
      filterTags = filterTags.includes(k) ? filterTags.filter(x => x !== k) : [...filterTags, k];
      renderFilterbar();
      renderPanel();
      $('#panelPick').scrollTop = 0;
    });
  });
}

/* ---------- 详情 ---------- */
function openDetail(s){
  detailSpot = s;
  const has = trip.some(x => x.u === s.u && x.n === s.n);
  $('#mHero').innerHTML = `<span class="em">${s.e}</span>` +
    (s.img ? `<img src="${s.img}" alt="${s.n}" onerror="this.remove()">` : '');
  $('#mName').textContent = s.n;
  const c = cityMap[s.u];
  $('#mCity').textContent = (c ? c.name : s.u) + (c ? ' · ' + c.region : '');
  $('#mTags').innerHTML = s.tags.map(t => `<span class="tg" data-t="${t}">${t}</span>`).join('');
  $('#mHi').textContent = s.hi || s.d;
  $('#mFacts').innerHTML = `
    <div class="fact"><b>${s.t}</b><span>建议时长</span></div>
    <div class="fact"><b>${s.fee}</b><span>门票参考</span></div>
    <div class="fact"><b>${s.u}</b><span>所在城市</span></div>`;
  $('#mTip').innerHTML = `<b>💡 小贴士</b>　${s.tip || ''}`;
  const btn = $('#mAdd');
  btn.textContent = has ? '已在行程中' : '加入行程';
  btn.classList.toggle('done', has);
  $('#modal').classList.add('on');
}

function closeDetail(){
  $('#modal').classList.remove('on');
  detailSpot = null;
}

function addSpot(s){
  if(trip.some(x => x.u === s.u && x.n === s.n)) return;
  trip.push({u:s.u, n:s.n, e:s.e, t:s.t, img:s.img});
  save(); updateCount();
  toast(`已加入 · 第 ${trip.length} 站`);
  const st = $('#panelPick').scrollTop;
  renderPanel();
  $('#panelPick').scrollTop = st;
  syncPinStates();
  if(detailSpot && detailSpot.u === s.u && detailSpot.n === s.n){
    $('#mAdd').textContent = '已在行程中';
    $('#mAdd').classList.add('done');
  }
}

/* ---------- 行程页 ---------- */
function updateCount(){
  const em = $('#tripCount');
  em.textContent = trip.length;
  em.classList.toggle('zero', trip.length === 0);
  updatePickMarks();
}

function updatePickMarks(){
  document.querySelectorAll('#bigmap .region').forEach(p=>{
    const n = trip.filter(x => x.u === p.dataset.city).length;
    p.classList.toggle('picked', n > 0);
    const tip = p.querySelector('title');
    if(tip){
      const base = cityMap[p.dataset.city];
      tip.textContent = base.name + ' · ' + base.region + (n ? `（已选 ${n} 个景点）` : '');
    }
  });
  syncPinStates();
}

/* 按景点真实经纬度取点；同一城市景点可能几乎重合，就近错开一点 */
function tripPoints(){
  const pts = {};
  const used = [];
  trip.forEach((s,i)=>{
    const sp = SPOTS.find(x => x.u === s.u && x.n === s.n);
    let base;
    if(sp && typeof sp.lon === 'number'){
      base = geo2svg(sp.lon, sp.lat);
    }else{
      const c = cityMap[s.u];
      base = c ? { x: c.cx, y: c.cy } : { x: 500, y: 430 };
    }
    let x = base.x, y = base.y;
    for(let step = 0; step < 14; step++){
      const near = used.some(p => Math.hypot(p.x - x, p.y - y) < 26);
      if(!near) break;
      const ang = step * 2.399963;          // 黄金角，散得匀
      const rad = 26 + step * 5;
      x = base.x + Math.cos(ang) * rad;
      y = base.y + Math.sin(ang) * rad;
    }
    used.push({ x, y });
    pts[i] = { x, y, r: 12 };
  });
  return pts;
}

/* 两个景点之间的直线距离（公里），够用就行 */
function kmBetween(a, b){
  const sa = SPOTS.find(x => x.u === a.u && x.n === a.n);
  const sb = SPOTS.find(x => x.u === b.u && x.n === b.n);
  if(!sa || !sb || typeof sa.lon !== 'number' || typeof sb.lon !== 'number') return null;
  const mlat = (sa.lat + sb.lat) / 2;
  const dx = (sb.lon - sa.lon) * 111 * Math.cos(mlat * Math.PI / 180);
  const dy = (sb.lat - sa.lat) * 111;
  return Math.hypot(dx, dy);
}

function fmtKm(km){
  if(km == null) return '';
  if(km < 1) return '不到 1 公里';
  if(km < 10) return Math.round(km) + ' 公里';
  return Math.round(km / 10) * 10 + ' 公里';
}

function renderTrip(){
  const svg = $('#mapRoute');
  buildMap(svg, 'route');

  const cities = [...new Set(trip.map(s=>s.u))];
  cities.forEach(short=>{
    const p = svg.querySelector(`.region[data-city="${short}"]`);
    if(p){ p.classList.remove('dim'); p.classList.add('on'); }
    const t = svg.querySelector(`.clabel[data-city="${short}"]`);
    if(t){
      t.classList.add('on');
      t.setAttribute('y', cityMap[short].cy + 46);   // 让开编号点
    }
  });

  const list = $('#tripList');
  if(!trip.length){
    list.innerHTML = `<div class="empty"><div class="big">📝</div><p>行程单还是空的</p><small>回地图页挑几个景点<br>这里就会长出路线</small></div>`;
    $('#stSpots').textContent = 0;
    $('#stCities').textContent = 0;
    $('#stDays').textContent = 0;
    $('#stKm').textContent = 0;
    $('#tripHint').classList.add('hide');
    return;
  }

  const pts = tripPoints();
  const NS = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(NS,'defs');
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  svg.appendChild(defs);

  const gl = document.createElementNS(NS,'g');
  for(let i=0;i<trip.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx,dy) || 1;
    const off = Math.min(34, len * 0.16);   // 短距离就别画太弯
    const mx = (a.x+b.x)/2 + (-dy/len)*off;
    const my = (a.y+b.y)/2 + (dx/len)*off;
    const path = document.createElementNS(NS,'path');
    path.setAttribute('d', `M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}`);
    path.setAttribute('class','routepath');
    path.setAttribute('marker-end','url(#ah)');
    gl.appendChild(path);
  }
  svg.appendChild(gl);

  const gp = document.createElementNS(NS,'g');
  trip.forEach((s,i)=>{
    const p = pts[i];
    const g = document.createElementNS(NS,'g');
    g.setAttribute('class','rpin' + (i===0 ? ' first' : ''));
    const cir = document.createElementNS(NS,'circle');
    cir.setAttribute('cx',p.x); cir.setAttribute('cy',p.y); cir.setAttribute('r',p.r);
    const tx = document.createElementNS(NS,'text');
    tx.setAttribute('x',p.x); tx.setAttribute('y',p.y);
    tx.setAttribute('font-size', 12.5);
    tx.textContent = i+1;
    const ti = document.createElementNS(NS,'title');
    ti.textContent = `第 ${i+1} 站 · ${s.u} ${s.n}`;
    g.appendChild(ti); g.appendChild(cir); g.appendChild(tx);
    gp.appendChild(g);
  });
  svg.appendChild(gp);

  list.innerHTML = '';
  trip.forEach((s,i)=>{
    if(i > 0){
      const km = kmBetween(trip[i-1], s);
      if(km != null){
        const leg = document.createElement('div');
        leg.className = 'leg';
        leg.innerHTML = `<i></i><span>直线约 ${fmtKm(km)}</span>`;
        list.appendChild(leg);
      }
    }
    const li = document.createElement('div');
    li.className = 'step';
    li.innerHTML = `
      <span class="num">${i+1}</span>
      <div class="body">
        <h3>${s.e} ${s.n}</h3>
        <p>${s.u} · ${s.t}</p>
      </div>
      <div class="ops">
        <button data-act="up" ${i===0?'disabled':''} title="上移">↑</button>
        <button data-act="down" ${i===trip.length-1?'disabled':''} title="下移">↓</button>
        <button data-act="del" class="del" title="删除">✕</button>
      </div>`;
    li.querySelectorAll('.ops button').forEach(b=>{
      b.addEventListener('click', ()=>act(b.dataset.act, i));
    });
    list.appendChild(li);
  });

  const days = trip.reduce((a,s)=> a + (STAY_DAYS[s.t] || 1), 0);
  let totalKm = 0;
  for(let i=1;i<trip.length;i++){
    const d = kmBetween(trip[i-1], trip[i]);
    if(d != null) totalKm += d;
  }
  $('#stSpots').textContent = trip.length;
  $('#stCities').textContent = cities.length;
  $('#stDays').textContent = Math.ceil(days);
  $('#stKm').textContent = Math.round(totalKm);
  $('#tripHint').classList.toggle('hide', trip.length < 2);
}

function act(type, i){
  if(type === 'del') trip.splice(i,1);
  if(type === 'up' && i > 0){ [trip[i-1], trip[i]] = [trip[i], trip[i-1]]; }
  if(type === 'down' && i < trip.length-1){ [trip[i+1], trip[i]] = [trip[i], trip[i+1]]; }
  save(); updateCount(); renderTrip();
  refreshCityPanel();
}

function refreshCityPanel(){
  if(!currentCity && !filterTags.length) return;
  const st = $('#panelPick').scrollTop;
  renderPanel();
  $('#panelPick').scrollTop = st;
}

/* ---------- 切换 ---------- */
let win = 'map';
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    win = t.dataset.view;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x === t));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id === 'view-' + win));
    if(win === 'trip') renderTrip(); else { refreshCityPanel(); render(); }
  });
});
$('#btnBack').addEventListener('click', ()=>document.querySelector('.tab[data-view="map"]').click());
$('#btnClear').addEventListener('click', ()=>{
  if(!trip.length) return;
  if(confirm('确定要清空这张行程单吗？')){
    trip = []; save(); updateCount(); renderTrip();
    refreshCityPanel();
  }
});

/* ---------- 启动 ---------- */
SPOTS.forEach((s, i)=>{
  s.img = 'assets/spots/' + String(i + 1).padStart(2, '0') + '.webp';
});

buildBigMap();
bindMapEvents();
computeNearest();
fitAll(false);
buildMap($('#mapRoute'), 'route');
renderQuick();
renderFilterbar();
updateCount();

$('#mClose').addEventListener('click', closeDetail);
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeDetail(); });
$('#mAdd').addEventListener('click', () => { if(detailSpot) addSpot(detailSpot); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDetail(); });

setTimeout(()=>$('#hint').classList.add('hide'), 5200);
</script>
</body>
</html>
